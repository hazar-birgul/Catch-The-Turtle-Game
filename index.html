<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Catch the Turtle - a browser arcade game. Catch as many turtles as you can before time runs out."
    />
    <title>Catch the Turtle</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0b1613;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Stop mobile browsers scrolling, zooming or rubber-banding when the
           player taps the playfield. */
        overscroll-behavior: none;
        touch-action: none;
        /* A double tap on a target must not select text or pop a callout. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Keep the canvas clear of notches and home indicators. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      #game-root canvas {
        display: block;
        touch-action: none;
      }

      /* Shown only if the module script never runs (no JS, or a failed load). */
      .no-script {
        color: #7f9d93;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <noscript>
        <p class="no-script">Catch the Turtle needs JavaScript enabled to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
