<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Catch the Turtle - a browser arcade game. Catch as many turtles as you can before time runs out."
    />
    <title>Catch the Turtle</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        /* Pure black, one step below the canvas ground (#0a0a0a), so the
           letterbox bars read as deliberate surround rather than as an unpainted
           gap. The two are close enough that no edge draws attention to itself. */
        background: #000000;
        overflow: hidden;
      }

      body {
        /* The safe-area inset lives here, not on #game-root. Phaser measures its
           parent with getBoundingClientRect(), which includes padding, so padding
           on the parent would have it size the canvas to a box larger than the
           one CSS centres it in. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        /* Stop mobile browsers scrolling, zooming or rubber-banding when the
           player taps the playfield. */
        overscroll-behavior: none;
        touch-action: none;
        /* A double tap on a target must not select text or pop a callout. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * Centring happens here and ONLY here.
       *
       * Phaser's Scale Manager is set to `NO_CENTER` (see `gameConfig.ts`) so
       * that it sizes the canvas and leaves positioning alone. With
       * `CENTER_BOTH` it also writes `margin-left`/`margin-top` onto the canvas,
       * and grid — which centres an item by its outer size, margins included —
       * would then centre an already-offset box and leave it visibly off-centre.
       *
       * Grid is the better owner here because it centres inside the content box,
       * so the safe-area inset on <body> is actually honoured on notched devices.
       */
      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      #game-root canvas {
        display: block;
        touch-action: none;
        /* The canvas is the only lit surface on the page; nothing frames it. */
        max-width: 100%;
        max-height: 100%;
      }

      /* Shown only if the module script never runs (no JS, or a failed load). */
      .no-script {
        color: #a3a3a3;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <noscript>
        <p class="no-script">Catch the Turtle needs JavaScript enabled to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
